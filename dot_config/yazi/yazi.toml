#git.yazi
[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*/"
run   = "git"
group = "git"

[plugin]
prepend_preloaders = [

  # --- gvfs.yazi ---
  # Do not preload files in mounted locations:
  # Environment variable won't work here.
  # Using absolute path instead.
  #{ url = "/run/user/1000/gvfs/**/*", run = "noop" },
{ url = "/run/user/*/gvfs/**/*", run = "noop" },

  # For mounted hard disk/drive
  #{ url = "/run/media/USER_NAME/**/*", run = "noop" },
{ url = "/run/media/*/**/*", run = "noop" },

  # --- duckdb.yazi ---
  # { url = "*.csv", run = "duckdb" },  
  # { url = "*.tsv", run = "duckdb" },  
  # { url = "*.json", run = "duckdb" },  
  # { url = "*.parquet", run = "duckdb" },  
  # { url = "*.txt", run = "duckdb" },  
  # { url = "*.xlsx", run = "duckdb" },  
  # { url = "*.db", run = "duckdb" },
  # { url = "*.duckdb", run = "duckdb" },
{ url = "*.{csv,tsv,parquet,txt,xlsx,db,duckdb}", run = "duckdb" },

  # --- mediainfo.yazi ---
  # Replace magick, image, video with mediainfo
{ mime = "{audio,video,image}/*", run = "mediainfo" },
{ mime = "application/subrip", run = "mediainfo" },

  # Adobe Photoshop is image/adobe.photoshop, already handled above
  # Adobe Illustrator
{ mime = "application/postscript", run = "mediainfo" },
{ mime = "application/illustrator", run = "mediainfo" },
{ mime = "application/dvb.ait", run = "mediainfo" },
{ mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
{ mime = "image/x-eps", run = "mediainfo" },
{ mime = "application/eps", run = "mediainfo" },

  # Sometimes AI file is recognized as "application/pdf". Lmao.
  # In this case use file extension instead:
{ url = "*.{ai,eps,ait}", run = "mediainfo" },

  # Hide metadata by default.
  # Example for image mimetype:
{ mime = "{image}/*", run = "mediainfo --no-metadata" },

  # Hide image preview by default.
  # Example for video mimetype:
{ mime = "{video}/*", run = "mediainfo --no-preview" },

  # NOTE: Use both --no-metadata and --no-preview will display nothing. :)
  # Make sure both of your previewers and preloaders has the same arguments (--no-metadata and --no-preview)

  # --- Office.yazi ---
{ mime = "application/openxmlformats-officedocument.*", run = "office" },
{ mime = "application/oasis.opendocument.*", run = "office" },
{ mime = "application/ms-*", run = "office" },
{ mime = "application/msword", run = "office" },
{ name = "*.docx", run = "office" },
]
prepend_previewers = [

  # --- gvfs.yazi ---
  # Allow to preview folder.
  #{ url = "*/", run = "folder" },

  # Do not previewing files in mounted locations.
  # Uncomment the line below to allow previewing text files.
  # { mime = "{text/*,application/x-subrip}", run = "code" },

  # Using absolute path.
  #{ url = "/run/user/1000/gvfs/**/*", run = "noop" },
{ url = "/run/user/*/gvfs/**/*", run = "noop" },

  # For mounted hard disk/drive.
  #{ url = "/run/media/USER_NAME/**/*", run = "noop" },
{ url = "/run/media/*/**/*", run = "noop" },

  # --- duckdb.yazi ---
  # { url = "*.csv", run = "duckdb", multi = false },  
  # { url = "*.tsv", run = "duckdb", multi = false },  
  # { url = "*.json", run = "duckdb", multi = false },  
  # { url = "*.parquet", run = "duckdb", multi = false },
  # { url = "*.txt", run = "duckdb", multi = false },  
  # { url = "*.xlsx", run = "duckdb", multi = false },
{ url = "*.{csv,tsv,parquet,txt,xlsx,db,duckdb}", run = "duckdb", multi = false },

  # --- rich-preview.yazi ---
  #{ url = "*.csv", run = "rich-preview"}, # for csv files
  # { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
  # { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
  # { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
  #{ url = "*.json", run = "rich-preview"}, # for json (.json) files
  #{ url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
{ url = "*.{md,rst,ipynb,json}", run = "rich-preview" },

  # --- mediainfo.yazi ---
  # Replace magick, image, video with mediainfo
{ mime = "{audio,video,image}/*", run = "mediainfo"},
{ mime = "application/subrip", run = "mediainfo" },

  # Adobe Photoshop is image/adobe.photoshop, already handled above
  # Adobe Illustrator
{ mime = "application/postscript", run = "mediainfo" },
{ mime = "application/illustrator", run = "mediainfo" },
{ mime = "application/dvb.ait", run = "mediainfo" },
{ mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
{ mime = "image/x-eps", run = "mediainfo" },
{ mime = "application/eps", run = "mediainfo" },

  # Sometimes AI file is recognized as "application/pdf". Lmao.
  # In this case use file extension instead:
{ url = "*.{ai,eps,ait}", run = "mediainfo" },

  # Hide metadata by default.
  # Example for image mimetype:
{ mime = "{image}/*", run = "mediainfo --no-metadata" },

  # Hide image preview by default.
  # Example for video mimetype:
{ mime = "{video}/*", run = "mediainfo --no-preview" },

  # NOTE: Use both --no-metadata and --no-preview will display nothing. :)
  # Make sure both of your previewers and preloaders has the same arguments (--no-metadata and --no-preview)

  # --- ouch.yazi ---
{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}" ,run = "ouch --archive-icon='🗄️' --show-file-icons"},

  # --- torrent-preview.yazi ---
{ mime = "application/bittorrent", run = "torrent-preview"},

  # --- Office ---
{ mime = "application/openxmlformats-officedocument.*", run = "office" },
{ mime = "application/oasis.opendocument.*", run = "office" },
{ mime = "application/ms-*", run = "office" },
{ mime = "application/msword", run = "office" },
{ name = "*.docx", run = "office" },

  # --- piper.yazi ---
{ mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },
{ url = "*/", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' },

]

# ---mediainfo.yazi ---
# There are more extensions, mime types which are supported by mediainfo.
# Just add file's MIME type to `previewers`, `preloaders` above.
# https://mediaarea.net/en/MediaInfo/Support/Formats
# If it's not working, file an issue at https://github.com/boydaihungst/mediainfo.yazi/issues

# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks
#[tasks]
#  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB



[[plugin.append_previewers]]
url = "*"
run = 'piper -- hexyl --border=none --terminal-width=$w "$1"'

